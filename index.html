<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS부동산 매물지도</title>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=5aac168af365fa2024b4fd331bcf9463&libraries=services,clusterer&autoload=false"></script>

<style>
:root {
  --blue:#1e88ff;
  --blue-dark:#006de5;
  --green:#03c75a;
  --red:#ff4d4f;
  --gray:#f4f6f8;
  --text:#222;
  --muted:#777;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:Arial, sans-serif;
  color:var(--text);
  background:#f5f7fb;
}

#wrap {
  display:flex;
  height:100vh;
}

#sidebar {
  width:430px;
  background:#fff;
  border-right:1px solid #ddd;
  overflow:auto;
  box-shadow:2px 0 8px rgba(0,0,0,0.05);
  z-index:5;
}

#map {
  flex:1;
}

.header {
  padding:18px 16px;
  font-size:22px;
  font-weight:800;
  border-bottom:1px solid #eee;
  background:linear-gradient(135deg,#1e88ff,#005bea);
  color:#fff;
}

.filters {
  padding:14px;
  border-bottom:1px solid #eee;
  background:#fff;
}

.filter-title {
  font-size:14px;
  font-weight:bold;
  margin-bottom:8px;
}

.filters input,
.filters select {
  width:100%;
  padding:10px;
  margin-bottom:8px;
  border:1px solid #d8dee8;
  border-radius:8px;
  font-size:14px;
  outline:none;
  background:white;
}

.filters input:focus,
.filters select:focus {
  border-color:var(--blue);
}

.row {
  display:flex;
  gap:8px;
}

.row input {
  width:50%;
}

.btn-row {
  display:flex;
  gap:8px;
  margin-top:4px;
}

button {
  padding:10px;
  border:0;
  cursor:pointer;
  border-radius:8px;
  font-weight:bold;
}

.detail-btn {
  flex:1;
  background:#eef4ff;
  color:#005bea;
}

.detail-btn.on {
  background:var(--blue);
  color:white;
}

.reset-btn {
  width:72px;
  background:#eef1f5;
  color:#333;
}

.favorite-filter-btn {
  width:90px;
  background:#ffe58f;
  color:#5c4300;
}

.favorite-filter-btn.on {
  background:#ffb300;
  color:white;
}

.detail-filter {
  display:none;
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed #d8dee8;
}

.detail-filter.open {
  display:block;
}

.apply-btn {
  width:100%;
  background:var(--blue);
  color:white;
}

#list {
  padding:10px;
}

.item {
  background:#fff;
  padding:14px;
  margin-bottom:10px;
  border:1px solid #e7ebf0;
  border-radius:14px;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,0.04);
}

.item:hover {
  background:#f8fbff;
  border-color:#bcd8ff;
}

.item.selected {
  border:2px solid var(--blue);
  background:#eef6ff;
}

.item.done {
  background:#f1f1f1;
  color:#999;
}

.item.done .price {
  color:#888;
}

.item-top {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}

.title {
  font-weight:800;
  font-size:16px;
  line-height:1.35;
}

.type-badge {
  display:inline-block;
  background:#eef4ff;
  color:#005bea;
  padding:3px 7px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  margin-right:4px;
}

.done-badge {
  display:inline-block;
  background:#ddd;
  color:#777;
  padding:3px 7px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  margin-right:4px;
}

.star {
  font-size:22px;
  cursor:pointer;
  color:#c7c7c7;
  user-select:none;
}

.star.on {
  color:#ffb300;
}

.price {
  color:var(--blue);
  margin-top:8px;
  font-size:15px;
  font-weight:bold;
}

.chips {
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}

.chip {
  background:#f1f4f8;
  padding:5px 7px;
  border-radius:999px;
  font-size:12px;
  color:#444;
}

.small {
  font-size:13px;
  color:#555;
  margin-top:6px;
  line-height:1.4;
}

.phone-row {
  display:flex;
  gap:6px;
  margin-top:9px;
}

.phone-btn {
  flex:1;
  text-align:center;
  padding:7px;
  border-radius:8px;
  font-size:13px;
  color:#fff;
  text-decoration:none;
  font-weight:bold;
}

.landlord { background:#1e88ff; }
.tenant { background:#03c75a; }

#status {
  position:absolute;
  top:12px;
  left:450px;
  background:white;
  padding:9px 12px;
  z-index:9999;
  border:1px solid #ddd;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.12);
  font-size:14px;
}

.circle-marker {
  width:38px;
  height:38px;
  border-radius:50%;
  background:var(--blue);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:bold;
  border:3px solid white;
  box-shadow:0 2px 8px rgba(0,0,0,0.35);
  cursor:pointer;
}

.circle-marker.done {
  background:#999;
}

.circle-marker.selected {
  background:#ff4d4f;
  transform:scale(1.12);
}

.circle-marker.done.selected {
  background:#777;
  transform:scale(1.12);
}

.info-card {
  width:270px;
  padding:10px;
  border-radius:12px;
  background:white;
  font-size:13px;
  line-height:1.38;
}

.info-title {
  font-weight:800;
  font-size:15px;
  margin-bottom:4px;
}

.info-sub {
  color:#555;
  font-size:12px;
  margin-bottom:5px;
}

.info-price {
  color:var(--blue);
  font-weight:bold;
  margin-top:5px;
}

.info-line {
  margin-top:3px;
  color:#444;
}

.info-memo {
  margin-top:5px;
  padding:6px;
  background:#f5f7fb;
  border-radius:8px;
  color:#444;
}

.info-btn {
  display:inline-block;
  margin-top:7px;
  margin-right:4px;
  padding:6px 8px;
  color:white;
  text-decoration:none;
  border-radius:7px;
  font-size:12px;
  font-weight:bold;
}

.call-btn { background:#1e88ff; }
.road-btn { background:#03c75a; }

#toggleBtn {
  display:none;
}

#roadviewModal {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.45);
  z-index:99999;
}

#roadviewBox {
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  background:white;
  width:320px;
  padding:20px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,0.25);
}

.rv-btn {
  display:block;
  background:#03c75a;
  color:white;
  padding:13px;
  margin-top:15px;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}

.rv-close {
  margin-top:10px;
  background:#eee;
  padding:9px;
  border-radius:6px;
  cursor:pointer;
}

@media (max-width:768px) {
  #wrap { display:block; }
  #map { width:100%; height:100vh; }

  #sidebar {
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:64%;
    z-index:999;
    transform:translateY(100%);
    transition:0.3s;
    border-right:0;
    border-top:1px solid #ddd;
    border-radius:18px 18px 0 0;
  }

  #sidebar.open {
    transform:translateY(0);
  }

  #toggleBtn {
    display:block;
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    z-index:1000;
    background:var(--blue);
    color:white;
    padding:13px 24px;
    border-radius:999px;
    box-shadow:0 3px 12px rgba(0,0,0,0.28);
  }

  #status {
    left:10px;
    top:10px;
    font-size:12px;
  }

  .header {
    font-size:18px;
    padding:14px;
  }
}
</style>
</head>

<body>

<div id="wrap">
  <div id="sidebar">
    <div class="header">JS부동산 매물지도</div>

    <div class="filters">
      <div class="filter-title">매물 검색</div>

      <input id="keyword" placeholder="지역 / 건물이름 / 호실 / 구분 / 메모 검색">

      <select id="typeFilter" onchange="applyFilter()">
        <option value="">구분 전체</option>
      </select>

      <div class="btn-row">
        <button id="detailBtn" class="detail-btn" onclick="toggleDetailFilter()">상세필터</button>
        <button id="favoriteBtn" class="favorite-filter-btn" onclick="toggleFavoriteOnly()">찜만</button>
        <button class="reset-btn" onclick="resetFilter()">해제</button>
      </div>

      <div id="detailFilter" class="detail-filter">
        <div class="row">
          <input id="minDeposit" placeholder="보증금 최소">
          <input id="maxDeposit" placeholder="보증금 최대">
        </div>

        <div class="row">
          <input id="minRent" placeholder="월세 최소">
          <input id="maxRent" placeholder="월세 최대">
        </div>

        <div class="row">
          <input id="minArea" placeholder="평수 최소">
          <input id="maxArea" placeholder="평수 최대">
        </div>

        <button class="apply-btn" onclick="applyFilter()">필터 적용</button>
      </div>
    </div>

    <div id="list"></div>
  </div>

  <div id="map"></div>
</div>

<button id="toggleBtn" onclick="toggleSidebar()">매물 보기</button>
<div id="status">로딩중...</div>

<div id="roadviewModal">
  <div id="roadviewBox">
    <h3>네이버 로드뷰 보기</h3>
    <p style="font-size:14px;color:#555;">
      네이버지도가 열리면<br>
      거리뷰/로드뷰 버튼을 눌러 확인하세요.
    </p>
    <a id="roadviewLink" class="rv-btn" target="_blank">네이버지도에서 위치 열기</a>
    <div class="rv-close" onclick="closeRoadviewModal()">닫기</div>
  </div>
</div>

<script>
var sheetURL = "https://docs.google.com/spreadsheets/d/1zRWqjc7xVkiTnFHFujBNI72qr_aDCgxiQipQlnGgWmU/gviz/tq?tqx=out:csv";

var map, geocoder, clusterer;
var allItems = [];
var currentItems = [];
var markers = [];
var overlays = [];
var infoWindows = [];
var selectedItemKey = null;
var favoriteOnly = false;
var favoriteKeys = JSON.parse(localStorage.getItem("favoriteKeys") || "[]");
var isRendering = false;
var markerVisibleLevel = 10;

function clean(t) {
  return (t || "").replaceAll('"', '').trim();
}

function escapeHtml(text) {
  return String(text || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function parseCSVLine(line) {
  var result = [];
  var current = "";
  var insideQuotes = false;

  for (var i = 0; i < line.length; i++) {
    var ch = line[i];

    if (ch === '"') {
      insideQuotes = !insideQuotes;
    } else if (ch === "," && !insideQuotes) {
      result.push(current);
      current = "";
    } else {
      current += ch;
    }
  }

  result.push(current);
  return result;
}

function itemKey(item) {
  return item.name + "|" + item.address + "|" + item.room + "|" + item.type;
}

function isDone(item) {
  return item.state === "계약완료";
}

function isFavorite(item) {
  return favoriteKeys.includes(item.key);
}

function toggleFavorite(key) {
  if (favoriteKeys.includes(key)) {
    favoriteKeys = favoriteKeys.filter(function(k) { return k !== key; });
  } else {
    favoriteKeys.push(key);
  }

  localStorage.setItem("favoriteKeys", JSON.stringify(favoriteKeys));
  applyFilter();
}

function toggleFavoriteOnly() {
  favoriteOnly = !favoriteOnly;
  document.getElementById("favoriteBtn").innerText = favoriteOnly ? "전체" : "찜만";
  document.getElementById("favoriteBtn").classList.toggle("on", favoriteOnly);
  applyFilter();
}

function toggleDetailFilter() {
  document.getElementById("detailFilter").classList.toggle("open");
  document.getElementById("detailBtn").classList.toggle("on");
}

function naverRoadviewUrl(lat, lng) {
  return "https://map.naver.com/v5/search/" + lat + "," + lng;
}

function openRoadviewModal(lat, lng) {
  document.getElementById("roadviewLink").href = naverRoadviewUrl(lat, lng);
  document.getElementById("roadviewModal").style.display = "block";
}

function closeRoadviewModal() {
  document.getElementById("roadviewModal").style.display = "none";
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
}

function setupEnterSearch() {
  var inputs = document.querySelectorAll("#keyword, #minDeposit, #maxDeposit, #minRent, #maxRent, #minArea, #maxArea");

  inputs.forEach(function(input) {
    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        applyFilter();
      }
    });
  });
}

function updateTypeOptions(items) {
  var select = document.getElementById("typeFilter");
  var currentValue = select.value;
  var types = [];

  items.forEach(function(item) {
    if (item.type && !types.includes(item.type)) {
      types.push(item.type);
    }
  });

  types.sort();

  select.innerHTML = '<option value="">구분 전체</option>';

  types.forEach(function(type) {
    var option = document.createElement("option");
    option.value = type;
    option.textContent = type;
    select.appendChild(option);
  });

  if (types.includes(currentValue)) {
    select.value = currentValue;
  }
}

function groupByAddress(items) {
  var grouped = {};

  items.forEach(function(item) {
    var key = item.address;

    if (!grouped[key]) {
      grouped[key] = {
        address: item.address,
        latlng: item.latlng,
        items: []
      };
    }

    grouped[key].items.push(item);
  });

  return Object.values(grouped);
}

kakao.maps.load(function() {
  map = new kakao.maps.Map(document.getElementById("map"), {
    center: new kakao.maps.LatLng(36.3504, 127.3845),
    level: 5
  });

  geocoder = new kakao.maps.services.Geocoder();

  clusterer = new kakao.maps.MarkerClusterer({
    map: map,
    averageCenter: true,
    minLevel: 8,
    disableClickZoom: true,
    styles: [{
      width: '44px',
      height: '44px',
      background: '#1e88ff',
      color: '#fff',
      textAlign: 'center',
      lineHeight: '44px',
      borderRadius: '22px',
      fontWeight: 'bold',
      border: '3px solid white',
      boxShadow: '0 2px 8px rgba(0,0,0,0.35)'
    }]
  });

  kakao.maps.event.addListener(clusterer, "clusterclick", function(cluster) {
    var selectedItems = cluster.getMarkers().map(function(marker) {
      return marker.__item;
    }).filter(Boolean);

    showList(selectedItems);
    document.getElementById("status").innerHTML = "선택 매물 " + selectedItems.length + "개";

    if (window.innerWidth <= 768) {
      document.getElementById("sidebar").classList.add("open");
    }
  });

  kakao.maps.event.addListener(map, "idle", function() {
    if (isRendering) return;
    updateOverlayVisibility();
    applyFilter();
  });

  setupEnterSearch();
  loadSheet();

  setInterval(function() {
    loadSheet(true);
  }, 60000);
});

function loadSheet(isAuto) {
  fetch(sheetURL)
    .then(function(res) { return res.text(); })
    .then(function(data) {
      var rows = data.trim().split("\n");
      var rawItems = [];

      for (var i = 1; i < rows.length; i++) {
        var c = parseCSVLine(rows[i]);

        var item = {
          name: clean(c[0]),
          address: clean(c[1]),
          room: clean(c[2]),
          type: clean(c[3]),
          deposit: Number(clean(c[4])) || 0,
          rent: Number(clean(c[5])) || 0,
          fee: Number(clean(c[6])) || 0,
          premium: Number(clean(c[7])) || 0,
          area: Number(clean(c[8])) || 0,
          landlordPhone: clean(c[9]),
          tenantPhone: clean(c[10]),
          memo: clean(c[11]),
          state: clean(c[12]),
          latlng: null
        };

        item.key = itemKey(item);

        if (item.address) rawItems.push(item);
      }

      geocodeItems(rawItems, function(doneItems) {
        allItems = doneItems;
        updateTypeOptions(allItems);
        applyFilter();
        document.getElementById("status").innerHTML = isAuto ? "자동 업데이트 완료 " + allItems.length + "개" : "매물 " + allItems.length + "개 불러옴";
      });
    })
    .catch(function(err) {
      document.getElementById("status").innerHTML = "시트 오류";
      console.error(err);
    });
}

function geocodeItems(items, callback) {
  var done = [];
  var pending = items.length;

  if (pending === 0) {
    callback([]);
    return;
  }

  items.forEach(function(item) {
    geocoder.addressSearch(item.address, function(result, status) {
      if (status === kakao.maps.services.Status.OK) {
        item.latlng = new kakao.maps.LatLng(result[0].y, result[0].x);
        done.push(item);
      }

      pending--;
      if (pending <= 0) callback(done);
    });
  });
}

function getFilteredItems() {
  if (!map) return allItems;

  var bounds = map.getBounds();

  var keyword = document.getElementById("keyword").value.trim();
  var selectedType = document.getElementById("typeFilter").value;

  var minDeposit = Number(document.getElementById("minDeposit").value) || 0;
  var maxDeposit = Number(document.getElementById("maxDeposit").value) || 999999999;

  var minRent = Number(document.getElementById("minRent").value) || 0;
  var maxRent = Number(document.getElementById("maxRent").value) || 999999999;

  var minArea = Number(document.getElementById("minArea").value) || 0;
  var maxArea = Number(document.getElementById("maxArea").value) || 999999999;

  return allItems.filter(function(item) {
    var matchKeyword =
      !keyword ||
      item.name.includes(keyword) ||
      item.address.includes(keyword) ||
      item.room.includes(keyword) ||
      item.type.includes(keyword) ||
      item.memo.includes(keyword);

    var matchType = !selectedType || item.type === selectedType;

    var matchPrice =
      item.deposit >= minDeposit &&
      item.deposit <= maxDeposit &&
      item.rent >= minRent &&
      item.rent <= maxRent &&
      item.area >= minArea &&
      item.area <= maxArea;

    var matchFavorite = !favoriteOnly || isFavorite(item);

    var inMap = item.latlng && bounds.contain(item.latlng);

    return matchKeyword && matchType && matchPrice && matchFavorite && inMap;
  });
}

function clearMap() {
  clusterer.clear();

  markers.forEach(function(m) { m.setMap(null); });
  overlays.forEach(function(o) { o.setMap(null); });
  infoWindows.forEach(function(i) { i.close(); });

  markers = [];
  overlays = [];
  infoWindows = [];
  document.getElementById("list").innerHTML = "";
}

function applyFilter() {
  var filtered = getFilteredItems();
  currentItems = filtered;

  drawItems(filtered);
  document.getElementById("status").innerHTML = "검색 결과 " + filtered.length + "개";
}

function drawItems(items) {
  isRendering = true;
  clearMap();

  var groups = groupByAddress(items);

  groups.forEach(function(group) {
    if (!group.latlng) return;

    var count = group.items.length;
    var hasDone = group.items.some(function(item) {
      return isDone(item);
    });

    var marker = new kakao.maps.Marker({
      position: group.latlng,
      opacity: 0.01
    });

    marker.__group = group;
    marker.__items = group.items;
    marker.__item = group.items[0];

    var overlayContent =
      '<div class="circle-marker' + (hasDone ? ' done' : '') + '" onclick="openGroupByAddress(\'' + encodeURIComponent(group.address) + '\')">' + count + '</div>';

    var overlay = new kakao.maps.CustomOverlay({
      position: group.latlng,
      content: overlayContent,
      yAnchor: 0.5,
      xAnchor: 0.5
    });

    overlay.__group = group;

    markers.push(marker);
    overlays.push(overlay);

    group.items.forEach(function(item) {
      var itemMarker = new kakao.maps.Marker({
        position: item.latlng,
        opacity: 0.01
      });

      itemMarker.__item = item;
      clusterer.addMarker(itemMarker);
      markers.push(itemMarker);
    });

    addGroupItemsToList(group.items);
  });

  updateOverlayVisibility();
  isRendering = false;
}

function addGroupItemsToList(items) {
  items.forEach(function(item) {
    var marker = markers.find(function(m) {
      return m.__item === item;
    });

    addListItem(item, marker, null);
  });
}

function updateOverlayVisibility() {
  var show = map.getLevel() <= markerVisibleLevel;

  overlays.forEach(function(o) {
    o.setMap(show ? map : null);
  });
}

function openGroupByAddress(encodedAddress) {
  var address = decodeURIComponent(encodedAddress);
  var matched = currentItems.filter(function(item) {
    return item.address === address;
  });

  showList(matched);
  document.getElementById("status").innerHTML = address + " 매물 " + matched.length + "개";

  if (window.innerWidth <= 768) {
    document.getElementById("sidebar").classList.add("open");
  }
}

function makeInfoContent(item, lat, lng) {
  var doneLabel = isDone(item) ? "[계약완료] " : "";
  var typeLabel = item.type ? "[" + escapeHtml(item.type) + "] " : "";

  return (
    '<div class="info-card">' +
      '<div class="info-title">' + doneLabel + typeLabel + escapeHtml(item.name) + '</div>' +
      '<div class="info-sub">' + escapeHtml(item.address) + ' / ' + escapeHtml(item.room) + '</div>' +
      '<div class="info-price">보증금 ' + item.deposit + ' / 월세 ' + item.rent + '</div>' +
      '<div class="info-line">관리비 ' + item.fee + ' / 권리금 ' + item.premium + ' / ' + item.area + '평</div>' +
      '<div class="info-line">임대인☎ ' + escapeHtml(item.landlordPhone) + '</div>' +
      '<div class="info-line">세입자☎ ' + escapeHtml(item.tenantPhone) + '</div>' +
      '<div class="info-memo">' + escapeHtml(item.memo) + '</div>' +
      '<a class="info-btn call-btn" href="tel:' + escapeHtml(item.landlordPhone) + '">임대인</a>' +
      '<a class="info-btn call-btn" href="tel:' + escapeHtml(item.tenantPhone) + '">세입자</a>' +
      '<a class="info-btn road-btn" href="javascript:openRoadviewModal(' + lat + ',' + lng + ')">로드뷰</a>' +
    '</div>'
  );
}

function openItemByKey(encodedKey) {
  var key = decodeURIComponent(encodedKey);
  var item = allItems.find(function(i) { return i.key === key; });
  if (!item) return;

  var marker = markers.find(function(m) { return m.__item && m.__item.key === key; });

  openItem(item, marker, null);
}

function openItem(item, marker, info) {
  selectedItemKey = item.key;

  infoWindows.forEach(function(i) { i.close(); });

  showList([item]);
  document.getElementById("status").innerHTML = "선택 매물 1개";

  if (window.innerWidth <= 768) {
    document.getElementById("sidebar").classList.add("open");
  }
}

function showList(items) {
  document.getElementById("list").innerHTML = "";

  items.forEach(function(item) {
    var marker = markers.find(function(m) {
      return m.__item === item;
    });

    addListItem(item, marker, null);
  });
}

function addListItem(item, marker, info) {
  var div = document.createElement("div");
  div.className =
    "item" +
    (selectedItemKey === item.key ? " selected" : "") +
    (isDone(item) ? " done" : "");

  var doneLabel = isDone(item) ? '<span class="done-badge">계약완료</span>' : "";
  var typeLabel = item.type ? '<span class="type-badge">' + escapeHtml(item.type) + '</span>' : "";

  div.innerHTML =
    '<div class="item-top">' +
      '<div class="title">' + doneLabel + typeLabel + escapeHtml(item.name) + ' / ' + escapeHtml(item.address) + ' / ' + escapeHtml(item.room) + '</div>' +
      '<div class="star ' + (isFavorite(item) ? 'on' : '') + '" onclick="event.stopPropagation(); toggleFavorite(\'' + escapeHtml(item.key) + '\')">★</div>' +
    '</div>' +
    '<div class="price">보증금 ' + item.deposit + ' / 월세 ' + item.rent + '</div>' +
    '<div class="chips">' +
      '<span class="chip">관리비 ' + item.fee + '</span>' +
      '<span class="chip">권리금 ' + item.premium + '</span>' +
      '<span class="chip">' + item.area + '평</span>' +
    '</div>' +
    '<div class="small">임대인☎ ' + escapeHtml(item.landlordPhone) + '</div>' +
    '<div class="small">세입자☎ ' + escapeHtml(item.tenantPhone) + '</div>' +
    '<div class="small">' + escapeHtml(item.memo) + '</div>' +
    '<div class="phone-row">' +
      '<a class="phone-btn landlord" href="tel:' + escapeHtml(item.landlordPhone) + '" onclick="event.stopPropagation();">임대인 전화</a>' +
      '<a class="phone-btn tenant" href="tel:' + escapeHtml(item.tenantPhone) + '" onclick="event.stopPropagation();">세입자 전화</a>' +
    '</div>';

  div.onclick = function() {
    openItem(item, marker, info);
  };

  document.getElementById("list").appendChild(div);
}

function resetFilter() {
  document.getElementById("keyword").value = "";
  document.getElementById("typeFilter").value = "";
  document.getElementById("minDeposit").value = "";
  document.getElementById("maxDeposit").value = "";
  document.getElementById("minRent").value = "";
  document.getElementById("maxRent").value = "";
  document.getElementById("minArea").value = "";
  document.getElementById("maxArea").value = "";

  favoriteOnly = false;
  document.getElementById("favoriteBtn").innerText = "찜만";
  document.getElementById("favoriteBtn").classList.remove("on");
  selectedItemKey = null;

  drawItems(allItems);
  document.getElementById("status").innerHTML = "전체 매물 " + allItems.length + "개";
}
</script>

</body>
</html>
