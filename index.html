<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매물 지도</title>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=5aac168af365fa2024b4fd331bcf9463&libraries=services,clusterer&autoload=false"></script>

<style>
body {margin:0;font-family:Arial;}
#wrap{display:flex;height:100vh;}
#sidebar{width:390px;border-right:1px solid #ddd;overflow:auto;background:#fff;}
#map{flex:1;}

.header{padding:15px;font-size:20px;font-weight:bold;border-bottom:1px solid #ddd;}
.filters{padding:10px;border-bottom:1px solid #ddd;}
.filters input{width:95%;padding:6px;margin-bottom:5px;}
.row{display:flex;gap:5px;}
.row input{width:48%;}
button{padding:8px;border:0;cursor:pointer;}
.search-btn{background:#1e88ff;color:#fff;}
.reset-btn{background:#eee;}

.item{padding:10px;border-bottom:1px solid #eee;cursor:pointer;}
.item:hover{background:#f5f5f5;}
.title{font-weight:bold;}
.small{font-size:13px;color:#555;margin-top:3px;}
.price{color:#0066ff;margin-top:4px;}

#status{position:absolute;top:10px;left:410px;background:#fff;padding:6px;}

#toggleBtn{display:none;}

@media (max-width:768px){
 #wrap{display:block;}
 #map{width:100%;height:100vh;}
 #sidebar{
  position:fixed;bottom:0;left:0;width:100%;height:60%;
  transform:translateY(100%);transition:.3s;z-index:999;
 }
 #sidebar.open{transform:translateY(0);}
 #toggleBtn{
  display:block;position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%);
  background:#1e88ff;color:#fff;padding:12px 20px;
  border-radius:20px;z-index:1000;
 }
}
</style>
</head>

<body>

<div id="wrap">
 <div id="sidebar">
  <div class="header">매물</div>

  <div class="filters">
   <input id="keyword" placeholder="검색">

   <div class="row">
    <input id="minDeposit" placeholder="보증금 최소">
    <input id="maxDeposit" placeholder="보증금 최대">
   </div>

   <div class="row">
    <input id="minRent" placeholder="월세 최소">
    <input id="maxRent" placeholder="월세 최대">
   </div>

   <div class="row">
    <input id="minArea" placeholder="평수 최소">
    <input id="maxArea" placeholder="평수 최대">
   </div>

   <button class="search-btn" onclick="applyFilter()">검색</button>
   <button class="reset-btn" onclick="resetFilter()">해제</button>
  </div>

  <div id="list"></div>
 </div>

 <div id="map"></div>
</div>

<button id="toggleBtn" onclick="toggleSidebar()">매물 보기</button>
<div id="status">로딩중...</div>

<script>
var sheetURL="https://docs.google.com/spreadsheets/d/1zRWqjc7xVkiTnFHFujBNI72qr_aDCgxiQipQlnGgWmU/gviz/tq?tqx=out:csv";

var map,geocoder,clusterer;
var allItems=[],markers=[];

function clean(t){return (t||"").replaceAll('"','').trim();}

function parseCSV(l){
 let r=[],c="",q=false;
 for(let ch of l){
  if(ch=='"') q=!q;
  else if(ch==","&&!q){r.push(c);c="";}
  else c+=ch;
 }
 r.push(c);
 return r;
}

function toggleSidebar(){
 document.getElementById("sidebar").classList.toggle("open");
}

kakao.maps.load(function(){
 map=new kakao.maps.Map(document.getElementById("map"),{
  center:new kakao.maps.LatLng(36.35,127.38),level:5
 });

 geocoder=new kakao.maps.services.Geocoder();

 clusterer=new kakao.maps.MarkerClusterer({
  map:map,averageCenter:true,minLevel:1,disableClickZoom:true
 });

 kakao.maps.event.addListener(clusterer,"clusterclick",function(cluster){
  let arr=cluster.getMarkers().map(m=>m.item);
  showList(arr);
 });

 load();
});

function load(){
 fetch(sheetURL).then(r=>r.text()).then(d=>{
  let rows=d.trim().split("\n");
  let pending=rows.length-1;

  for(let i=1;i<rows.length;i++){
   let c=parseCSV(rows[i]);

   let item={
    name:clean(c[0]),
    address:clean(c[1]),
    room:clean(c[2]),
    deposit:+clean(c[3])||0,
    rent:+clean(c[4])||0,
    fee:+clean(c[5])||0,
    premium:+clean(c[6])||0,
    area:+clean(c[7])||0,
    phone1:clean(c[8]),
    phone2:clean(c[9]),
    memo:clean(c[10])
   };

   geocoder.addressSearch(item.address,(res,st)=>{
    if(st===kakao.maps.services.Status.OK){
     item.latlng=new kakao.maps.LatLng(res[0].y,res[0].x);
     allItems.push(item);

     let m=new kakao.maps.Marker({position:item.latlng});
     m.item=item;

     kakao.maps.event.addListener(m,'click',()=>{
      showList([item]);
      if(window.innerWidth<=768) toggleSidebar();
     });

     markers.push(m);
     clusterer.addMarker(m);
    }

    pending--;
    if(pending<=0){
     showList(allItems);
     status.innerHTML="완료";
    }
   });
  }
 });
}

function showList(arr){
 let list=document.getElementById("list");
 list.innerHTML="";

 arr.forEach(i=>{
  let div=document.createElement("div");
  div.className="item";

  div.innerHTML=
   `<div class="title">${i.name} / ${i.address} / ${i.room}</div>
    <div class="price">${i.deposit} / ${i.rent}</div>
    <div class="small">관리비 ${i.fee} / 권리금 ${i.premium} / ${i.area}평</div>
    <div class="small">임대인☎ ${i.phone1}</div>
    <div class="small">세입자☎ ${i.phone2}</div>
    <div class="small">${i.memo}</div>`;

  list.appendChild(div);
 });
}

function applyFilter(){
 let k=keyword.value;
 let minD=+minDeposit.value||0,maxD=+maxDeposit.value||999999999;
 let minR=+minRent.value||0,maxR=+maxRent.value||999999999;
 let minA=+minArea.value||0,maxA=+maxArea.value||999999999;

 let f=allItems.filter(i=>
  (!k||i.name.includes(k)||i.address.includes(k)||i.room.includes(k)) &&
  i.deposit>=minD&&i.deposit<=maxD &&
  i.rent>=minR&&i.rent<=maxR &&
  i.area>=minA&&i.area<=maxA
 );

 showList(f);
}

function resetFilter(){
 showList(allItems);
}
</script>

</body>
</html>
