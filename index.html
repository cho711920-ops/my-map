<template id="jsAuthenticatedApplication">
<div id="wrap" inert aria-hidden="true">
  <div id="sidebar">
    <div id="dragHandle"></div>
    <div class="header" role="button" tabindex="0" title="JS부동산 새로고침" aria-label="JS부동산 새로고침"
      onclick="window.location.reload()"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.location.reload();}">
      <b class="js-brand-mark-v1">JS</b><strong class="js-brand-name-v1">JS부동산</strong><small class="js-brand-subtitle-v2">대전 상가 매물지도</small>
    </div>

    <div class="filters">
      <div class="filter-title">매물 검색</div>

      <div class="v6-toolbar-primary">
        <div class="search-row">
          <input id="keyword" aria-label="지역, 건물 또는 호실 검색" placeholder="지역 / 건물 / 호실 검색 · 쉼표 다중검색 (괴정,탄방,월평)">
          <button class="search-btn" onclick="applyFilter()">
            <svg class="top-action-icon-v638" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.2 4.2"></path></svg>
            <span>검색</span>
          </button>
        </div>

        <button id="detailBtn" class="detail-btn" type="button" onclick="toggleDetailFilter()">
          <svg class="top-action-icon-v638" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>
          <span>필터</span>
        </button>
        <button id="topResetBtn" class="top-reset-btn" type="button" onclick="resetFilter()">
          <svg class="top-action-icon-v638" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.8 9A8 8 0 1 1 5 15.5"></path><path d="M4.8 4.8V9H9"></path></svg>
          <span>초기화</span>
        </button>
      </div>

      <div class="v6-toolbar-secondary extra-action-row v6-command-bar">
        <div class="v6-command-menu" data-command-menu="view">
          <button class="v6-command-trigger" type="button" onclick="toggleV6ActionMenu('view', event)" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.7"></circle></svg>
            <span>보기</span><span class="v6-command-caret" aria-hidden="true"></span>
          </button>
          <div id="v6ActionMenu_view" class="v6-command-dropdown" role="menu">
            <button id="hideDoneBtn" class="hide-done-btn on" type="button" role="menuitemcheckbox" aria-checked="true" onclick="toggleHideDone(); closeV6ActionMenus()"><span class="view-toggle-check" aria-hidden="true">✓</span><span>계약완료 숨김</span></button>
            <button id="doneOnlyBtn" type="button" role="menuitemcheckbox" aria-checked="false" onclick="toggleDoneOnly(); closeV6ActionMenus()"><span class="view-toggle-check" aria-hidden="true"></span><span>계약완료만 보기</span></button>
            <button id="gongsilOnlyBtn" class="gongsil-only-btn" type="button" role="menuitemcheckbox" aria-checked="false" onclick="toggleGongsilOnly(); closeV6ActionMenus()"><span class="view-toggle-check" aria-hidden="true">✓</span><span>임장할매물만보기</span></button>
            <button id="todayNewBtn" type="button" role="menuitemcheckbox" aria-checked="false" onclick="toggleTodayNewOnly(); closeV6ActionMenus()"><span class="view-toggle-check" aria-hidden="true">✓</span><span>오늘 신규만 보기</span></button>
            <div class="v6-command-divider"></div>
            <button id="favoriteBtn" class="favorite-filter-btn" type="button" onclick="openListManager('favorite'); closeV6ActionMenus()">찜목록</button>
          </div>
        </div>

        <div class="v6-command-menu" data-command-menu="work">
          <button class="v6-command-trigger" type="button" onclick="toggleV6ActionMenu('work', event)" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 4.2h5l.7 2.1 2 .8 2-.9 1.6 3.5-1.8 1.2v2.2l1.8 1.2-1.6 3.5-2-.9-2 .8-.7 2.1h-5l-.7-2.1-2-.8-2 .9-1.6-3.5L5 13.1v-2.2L3.2 9.7l1.6-3.5 2 .9 2-.8.7-2.1Z"></path><circle cx="12" cy="12" r="2.7"></circle></svg>
            <span>작업</span><span class="v6-command-caret" aria-hidden="true"></span>
          </button>
          <div id="v6ActionMenu_work" class="v6-command-dropdown" role="menu">
            <button id="printSelectedBtn" class="print-btn" type="button" onclick="printSelectedList(); closeV6ActionMenus()">선택인쇄</button>
            <button id="completeSelectedBtn" class="complete-selected-btn" type="button" onclick="completeSelectedItems(); closeV6ActionMenus()">계약완료</button>
            <button id="fieldVisitBtn" class="field-visit-btn" type="button" onclick="markSelectedAsVisited(); closeV6ActionMenus()">임장완료</button>
            <div class="v6-command-divider"></div>
            <button type="button" onclick="openOperationsCenter('dashboard'); closeV6ActionMenus()">운영현황</button>
            <button id="operationsCustomerMenuBtn" type="button" onclick="openOperationsCenter('customers'); closeV6ActionMenus()">고객매칭</button>
          </div>
        </div>

        <button class="v6-primary-action desktop-main-action desktop-operations-action" type="button"
          onclick="openOperationsCenter('dashboard')">
          <svg class="top-action-icon-v638" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7" width="17" height="12.5" rx="2"></rect><path d="M8.5 7V4.5h7V7M3.5 11.5h17M10 11.5v2h4v-2"></path></svg>
          <span>운영현황</span><i class="top-action-status-dot-v638" aria-hidden="true"></i>
        </button>
        <button class="v6-primary-action desktop-main-action desktop-customer-action" type="button"
          onclick="openOperationsCenter('customers')">
          <svg class="top-action-icon-v638" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><circle cx="17" cy="9" r="2.3"></circle><path d="M3.5 19c.4-4 2.2-6 5.5-6s5.1 2 5.5 6M14.5 14c3.4-.5 5.4 1.2 5.8 4.5"></path></svg>
          <span>고객매칭</span>
        </button>
        <button class="v6-primary-action desktop-main-action desktop-tell-v8" type="button"
          onclick="JSUnifiedListingsV8.openTell()">
          <svg class="top-action-icon-v638" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.8 10 8 8.2 10c1.1 2.5 3.1 4.5 5.6 5.6l2-1.8L20.2 17l-.7 3.2c-.2.8-.9 1.3-1.7 1.3C9.4 21.2 2.8 14.6 2.5 6.2c0-.8.5-1.5 1.3-1.7L7 3.8Z"></path></svg>
          <span>Tell</span>
        </button>

        <button class="v6-primary-action ai" type="button" onclick="startAiVisitPreview()">
          <svg class="top-action-icon-v638" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.2 3.1L16 7.3l-2.8 1.2L12 12l-1.2-3.5L8 7.3l2.8-1.2L12 3Z"></path><path d="M5.5 11.5 6.3 14 9 15l-2.7 1-.8 2.5-.8-2.5L2 15l2.7-1 .8-2.5ZM18.5 12l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z"></path></svg>
          <span>AI임장하기</span>
        </button>
        <button id="asyncMutationStatusV1" class="async-mutation-status-v1 idle" type="button" hidden
          title="백그라운드 저장 상태" aria-label="완료 0건, 저장 중 0건, 실패 0건">
          <span><small>완료</small><b>0</b></span>
          <span><small>저장중</small><b>0</b></span>
          <span><small>실패</small><b>0</b></span>
        </button>
        <button class="quick-add-btn quick-add-with-sync v6-primary-action v6-secondary-action" type="button" onclick="openQuickAddModal()">
          <svg class="top-action-icon-v638" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          <span>빠른등록</span>
          <span id="syncIndicator" class="sync-indicator syncing" title="동기화 중" aria-label="동기화 상태"></span>
        </button>
        <div id="customerMatchMapStatusCompactV2" class="customer-match-map-status-compact-v2" hidden>
          <span id="customerMatchMapStatusCompactTextV2"></span>
          <button type="button" title="고객매칭 필터 해제 후 전체 매물 보기" onclick="clearCustomerMatchMapFilter()">전체</button>
        </div>
      </div>
      <div id="multiClusterStatus" class="multi-cluster-status"></div>
      <div id="customerMatchMapStatus" class="customer-match-map-status" hidden>
        <span id="customerMatchMapStatusText"></span>
        <button type="button" onclick="clearCustomerMatchMapFilter()">전체 매물 보기</button>
      </div>

      <div id="detailFilter" class="detail-filter">
        <div class="row">
          <input id="minDeposit" aria-label="보증금 최소" placeholder="보증금 최소">
          <input id="maxDeposit" aria-label="보증금 최대" placeholder="보증금 최대">
        </div>

        <div class="row">
          <input id="minRent" aria-label="월세 최소" placeholder="월세 최소">
          <input id="maxRent" aria-label="월세 최대" placeholder="월세 최대">
        </div>

        <div class="row">
          <input id="minPremium" aria-label="권리금 최소" placeholder="권리금 최소">
          <input id="maxPremium" aria-label="권리금 최대" placeholder="권리금 최대">
        </div>

        <div class="row">
          <input id="minArea" aria-label="평수 최소" placeholder="평수 최소">
          <input id="maxArea" aria-label="평수 최대" placeholder="평수 최대">
        </div>

        <div class="row">
          <input id="minFloor" aria-label="층수 최소" inputmode="numeric" placeholder="층수 최소 (지하 -1)">
          <input id="maxFloor" aria-label="층수 최대" inputmode="numeric" placeholder="층수 최대">
        </div>

        <div class="row industry-filter-row">
          <input id="industryFilter" class="industry-filter-input" aria-label="업종 구분" placeholder="업종구분 (예: 식당, 카페)">
        </div>

        <button class="apply-btn" onclick="applyFilter()">필터 적용</button>
      </div>
    </div>

    <div id="listToolbar" class="list-toolbar" aria-label="매물목록 도구">
      <label class="list-master-select" title="현재 보이는 매물 전체선택/해제">
        <input id="listMasterCheckbox" type="checkbox" onchange="toggleVisibleSelection(this.checked)">
        <span class="list-master-checkmark" aria-hidden="true"></span>
        <span class="list-master-label">전체선택/해제</span>
      </label>

      <div class="list-toolbar-control list-source-control">
        <select id="sourceFilter" onchange="applyFilter()" aria-label="출처 필터">
          <option value="">출처</option>
          <option value="direct">직접등록</option>
          <option value="danggeun">당근</option>
          <option value="gongsil">공실박스</option>
          <option value="naver">네이버</option>
          <option value="unknown">출처미확인</option>
        </select>
      </div>

      <div class="list-toolbar-control list-type-control">
        <select id="typeFilter" onchange="applyFilter()" aria-label="매물 구분 필터">
          <option value="">구분</option>
        </select>
      </div>

      <div class="list-toolbar-control list-floor-control">
        <select id="floorQuickFilter" onchange="applyFilter()" aria-label="층 필터">
          <option value="">층</option>
          <option value="basement">지하</option>
          <option value="first">1층</option>
          <option value="upper">2층 이상</option>
          <option value="unknown">층 미확인</option>
        </select>
      </div>

      <div id="sortDropdown" class="sort-dropdown list-toolbar-control list-sort-control">
        <input id="sortFilter" type="hidden" value="latest">
        <button id="sortDropdownBtn" type="button" class="sort-dropdown-btn" onclick="toggleSortDropdown(event)" aria-haspopup="listbox" aria-expanded="false">
          <span class="v6-sort-label">정렬</span><span class="v6-filter-caret" aria-hidden="true"></span>
        </button>
        <div id="sortDropdownMenu" class="sort-dropdown-menu" role="listbox">
          <button class="sort-menu-single sort-menu-check selected" type="button" role="option" aria-selected="true" data-sort-value="latest" onclick="selectSortOption('latest')">
            <span class="sort-choice-check" aria-hidden="true"></span><span>최근등록순</span>
          </button>
        </div>
      </div>
    </div>

    <div id="selectionActionBar" class="selection-action-bar" hidden aria-live="polite">
      <button type="button" class="selection-favorite-btn" onclick="openSelectedFavoritesManagerV7()">매물찜하기</button>
      <button type="button" class="selection-contract-btn" onclick="completeSelectedItems()">계약완료</button>
      <button type="button" class="selection-visit-btn" onclick="markSelectedAsVisited()">임장완료</button>
      <button type="button" onclick="printSelectedList()">선택인쇄</button>
      <button type="button" class="selection-clear-btn" onclick="clearSelectedPrintItems()">선택해제</button>
      <strong id="selectionActionCount">0건 선택</strong>
    </div>

    <div id="list"></div>
  </div>

  <aside id="mapQuickTools" class="map-quick-tools" aria-label="지도 빠른 도구">
    <div class="map-quick-tools-inner">
      <div class="map-quick-tool-wrap">
        <button id="mapQuickViewBtn" class="map-quick-tool-btn" type="button"
          onclick="toggleMapQuickPopoverV657('view', event)" aria-expanded="false">
          <svg class="map-quick-icon-v638" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3-8 4 8 4 8-4-8-4Z"></path><path d="m4 12 8 4 8-4M4 17l8 4 8-4"></path></svg>
          <span>보기</span>
        </button>
        <div id="mapQuickPopoverView" class="map-quick-popover map-quick-view-popover" hidden>
          <button id="mapQuickTodayBtn" type="button" role="menuitemcheckbox" aria-checked="false"
            onclick="toggleTodayNewOnly(); syncMapQuickToolStateV657()">
            <span class="map-quick-check" aria-hidden="true"></span><span>오늘 신규만</span>
          </button>
          <button id="mapQuickVisitOnlyBtn" type="button" role="menuitemcheckbox" aria-checked="false"
            onclick="toggleGongsilOnly(); syncMapQuickToolStateV657()">
            <span class="map-quick-check" aria-hidden="true"></span><span>임장할매물만</span>
          </button>
          <button id="mapQuickHideDoneBtn" type="button" role="menuitemcheckbox" aria-checked="true"
            onclick="toggleHideDone(); syncMapQuickToolStateV657()">
            <span class="map-quick-check" aria-hidden="true"></span><span>계약완료 숨김</span>
          </button>
          <button id="mapQuickDoneOnlyBtn" type="button" role="menuitemcheckbox" aria-checked="false"
            onclick="toggleDoneOnly(); syncMapQuickToolStateV657()">
            <span class="map-quick-check" aria-hidden="true"></span><span>계약완료만 보기</span>
          </button>
        </div>
      </div>

      <button id="mapRoadviewSelectBtn" class="map-quick-tool-btn map-roadview-select map-roadview-vertical-v8" type="button"
        onclick="toggleMapRoadviewSelection()" title="지도에서 로드뷰 선택" aria-label="지도에서 로드뷰 선택" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="roadview-pin-shape" d="M12 2.1c-4 0-7.2 3.1-7.2 7 0 5.3 7.2 12.8 7.2 12.8s7.2-7.5 7.2-12.8c0-3.9-3.2-7-7.2-7Z"></path>
          <circle class="roadview-pin-hole" cx="12" cy="9" r="2.7"></circle>
        </svg>
        <span>로드뷰</span>
      </button>

      <div class="map-quick-tool-wrap">
        <button id="mapQuickListBtn" class="map-quick-tool-btn map-quick-heart-btn" type="button"
          onclick="openListManager('favorite'); closeMapQuickPopoversV657()" aria-label="찜목록 열기">
          <svg class="map-quick-icon-v638" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 5.8c-2-2.1-5.3-2.1-7.3 0L12 7.3l-1.5-1.5a5.1 5.1 0 0 0-7.3 7.2L12 21l8.8-8a5.1 5.1 0 0 0 0-7.2Z"></path></svg>
          <span>찜목록</span>
        </button>
      </div>

      <button id="multiClusterBtn" class="map-quick-tool-btn multi-cluster-btn" type="button"
        onclick="toggleMultiClusterMode()">
        <svg class="map-quick-icon-v638" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 6 1.6 1.6L8.5 4.7M11 6h9M4 12l1.6 1.6 2.9-2.9M11 12h9M4 18l1.6 1.6 2.9-2.9M11 18h9"></path></svg>
        <span>다중선택</span>
      </button>
      <button id="mapDistanceBtn" class="map-quick-tool-btn" type="button"
        onclick="toggleDistanceMeasureV657()">
        <svg class="map-quick-icon-v638" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 17 12-12 3 3L8 20l-3-3Z"></path><path d="m10 12 2 2M13 9l2 2M7 15l2 2"></path></svg>
        <span>거리측정</span>
      </button>

      <div class="map-quick-tool-wrap">
        <button id="mapRadiusBtn" class="map-quick-tool-btn" type="button"
          onclick="toggleMapQuickPopoverV657('radius', event)" aria-expanded="false">
          <svg class="map-quick-icon-v638" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke-dasharray="2.4 2.4"></circle><circle cx="12" cy="12" r="1.5"></circle></svg>
          <span>반경검색</span>
