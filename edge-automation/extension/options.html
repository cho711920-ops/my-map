<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JS 자동수집 설정</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header><div><h1>JS 자동수집 <small id="autoVersion"></small></h1><p>Edge가 네이버 → 당근 → 공실박스를 순서대로 실행합니다.</p></div><span id="status">확인 중</span></header>
    <section class="settings">
      <label class="toggle"><input id="enabled" type="checkbox"><span>매일 자동수집 사용</span></label>
      <label>실행 시간 <input id="schedule" type="time" value="06:00"></label>
      <label class="toggle"><input id="closeTabs" type="checkbox" checked><span>완료한 수집 탭 자동 닫기</span></label>
      <button id="save" class="primary">설정 저장</button>
      <button id="run">지금 전체 실행</button>
    </section>
    <section class="transfer">
      <div><h2>다른 PC로 설정 옮기기</h2><p>등록 지역·실행 시간만 이동하며 로그인 정보와 보안키는 포함하지 않습니다.</p></div>
      <div class="transfer-actions">
        <button id="exportConfig">설정 내보내기</button>
        <label class="file-button">설정 가져오기<input id="importConfig" type="file" accept=".json,application/json"></label>
      </div>
    </section>
    <section><div class="section-title"><h2>구별 수집 진행표</h2><small>수집 사이트 창은 하나만 사용하며, 네이버·당근 10개 구의 진행 결과를 여기에 표시합니다.</small></div><div id="runSummary" class="run-summary"></div><div id="targets" class="list"></div></section>
    <section><div class="section-title"><h2>최근 실행 기록</h2><button id="clear">기록 지우기</button></div><div id="logs" class="list"></div></section>
  </main>
  <script src="options.js"></script>
</body>
</html>
