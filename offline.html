<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0568e8">
  <title>인터넷 연결 확인 · JS부동산</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fa; color: #26354a; font-family: system-ui, sans-serif; }
    main { margin: 24px; max-width: 420px; text-align: center; }
    img { width: 72px; height: 72px; }
    h1 { margin: 24px 0 12px; font-size: 24px; }
    p { line-height: 1.7; color: #54647a; word-break: keep-all; }
    a { display: inline-block; margin-top: 12px; padding: 12px 24px; background: #0568e8; border-radius: 9px; color: white; text-decoration: none; }
    a:focus-visible { outline: 3px solid #73aafa; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/js-192.png" alt="JS부동산">
    <h1>인터넷 연결을 확인해 주세요</h1>
    <p>매물과 고객 정보를 불러오려면 인터넷 연결이 필요합니다. 연결 후 다시 열어 주세요.</p>
    <a href="/">다시 연결하기</a>
  </main>
</body>
</html>
